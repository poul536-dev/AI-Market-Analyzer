<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market Analyzer - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --border: #2a3a52;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --green: #22c55e;
            --green-dim: #166534;
            --green-bg: rgba(34, 197, 94, 0.1);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.1);
            --yellow: #eab308;
            --blue: #3b82f6;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(34,197,94,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(239,68,68,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 60%);
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .login-header h1 span {
            color: var(--accent);
        }

        .login-header .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .login-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .login-tab:hover {
            color: var(--text-secondary);
        }

        .login-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: #2563eb;
            box-shadow: 0 4px 20px rgba(59,130,246,0.3);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            padding: 10px 14px;
            background: var(--red-bg);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            color: var(--red);
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .success-msg {
            display: none;
            padding: 10px 14px;
            background: var(--green-bg);
            border: 1px solid rgba(34,197,94,0.3);
            border-radius: 8px;
            color: var(--green);
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-bg"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><span>AI</span> MARKET ANALYZER</h1>
                <div class="subtitle">Intelligent Market Analysis</div>
            </div>

            <div class="login-tabs">
                <button class="login-tab active" onclick="switchTab('login')">Entrar</button>
                <button class="login-tab" onclick="switchTab('register')">Cadastrar</button>
            </div>

            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>

            <div id="tab-login" class="tab-content active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="login-username" placeholder="Digite seu usuario" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="login-password" placeholder="Digite sua senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-login" id="login-btn">ENTRAR</button>
                </form>
            </div>

            <div id="tab-register" class="tab-content">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Nome de Exibicao</label>
                        <input type="text" id="reg-displayname" placeholder="Seu nome (opcional)">
                    </div>
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="reg-username" placeholder="Minimo 3 caracteres" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="reg-password" placeholder="Minimo 4 caracteres" required minlength="4" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="reg-password2" placeholder="Repita a senha" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-login" id="reg-btn">CRIAR CONTA</button>
                </form>
            </div>

            <div class="footer-text">AI Market Analyzer v4.0 - Acesso Autorizado</div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            hideMessages();

            if (tab === 'login') {
                document.querySelector('.login-tab:first-child').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else {
                document.querySelector('.login-tab:last-child').classList.add('active');
                document.getElementById('tab-register').classList.add('active');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'ENTRANDO...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value.trim(),
                        password: document.getElementById('login-password').value,
                    }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Credenciais invalidas');
                    btn.disabled = false;
                    btn.textContent = 'ENTRAR';
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (err) {
                showError('Erro de conexao com o servidor');
                btn.disabled = false;
                btn.textContent = 'ENTRAR';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessages();

            const pass1 = document.getElementById('reg-password').value;
            const pass2 = document.getElementById('reg-password2').value;

            if (pass1 !== pass2) {
                showError('As senhas nao coincidem');
                return;
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.textContent = 'CRIANDO...';

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value.trim(),
                        password: pass1,
                        display_name: document.getElementById('reg-displayname').value.trim() || null,
                    }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Erro ao criar conta');
                    btn.disabled = false;
                    btn.textContent = 'CRIAR CONTA';
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (err) {
                showError('Erro de conexao com o servidor');
                btn.disabled = false;
                btn.textContent = 'CRIAR CONTA';
            }
        }

        (function checkAuth() {
            fetch('/auth/me')
                .then(function(r) {
                    if (r.ok) {
                        return r.json();
                    }
                    return null;
                })
                .then(function(data) {
                    if (data && data.username) {
                        window.location.href = '/';
                    }
                })
                .catch(function() {});
        })();
    </script>
</body>
</html>
